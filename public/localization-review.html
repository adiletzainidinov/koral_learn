<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка мобильной версии QuranLearn</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e2e8f0;color:#0f172a;font:14px system-ui}header{padding:16px;background:white;border-bottom:1px solid #cbd5e1;display:flex;flex-wrap:wrap;align-items:center;gap:10px}button,select{padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:white}button{cursor:pointer}main{display:flex;gap:24px;padding:20px;align-items:flex-start}iframe{border:0;background:white;box-shadow:0 8px 32px #0f172a26;flex-shrink:0}aside{min-width:260px;max-width:620px;overflow:auto}pre{white-space:pre-wrap;word-break:break-word;background:white;padding:16px;border-radius:12px}h1{font-size:16px;margin:0 10px 0 0}
</style>
<header><h1>QuranLearn · Проверка адаптации</h1><select id="width" aria-label="Ширина экрана"><option>320</option><option>360</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1440</option></select><select id="route" aria-label="Страница"></select><select id="language" aria-label="Язык проверки"><option value="ru">Русский</option><option value="ky">Кыргызча</option></select><button id="check">Проверить страницу</button><button id="audit">Проверить все страницы</button><span id="status" role="status"></span></header>
<main><iframe id="screen" title="Экран телефона" width="390" height="844"></iframe><aside><h2>Результаты</h2><pre id="report">Загрузка…</pre></aside></main>
<script>
const routes=['/teacher-lessons','/teacher-lessons/five-purposes'];
const screen=document.getElementById('screen'),width=document.getElementById('width'),route=document.getElementById('route'),report=document.getElementById('report'),status=document.getElementById('status');
for(const path of routes){const o=document.createElement('option');o.value=path;o.textContent=path;route.append(o)}
const language=document.getElementById('language');
let dictionary={};fetch('/i18n-review-messages.json').then(r=>r.json()).then(value=>dictionary=value);
const delay=ms=>new Promise(r=>setTimeout(r,ms));
function inspect(){
 const doc=screen.contentDocument,win=screen.contentWindow,vw=doc.documentElement.clientWidth;
 const offenders=Array.from(doc.querySelectorAll('body *')).filter(el=>{const rect=el.getBoundingClientRect(),style=win.getComputedStyle(el);return rect.width>0&&rect.right>vw+1&&style.display!=='none'&&!el.closest('.table-scroll, [hidden]')}).slice(0,8).map(el=>({tag:el.tagName,class:el.className,right:Math.round(el.getBoundingClientRect().right),text:el.textContent.trim().slice(0,70)}));
 const untranslated=language.value==='ky'?Array.from(doc.querySelectorAll('body *')).filter(el=>el.children.length===0&&el.getBoundingClientRect().width>0&&el.textContent.trim()&&Object.hasOwn(dictionary,el.textContent.trim())&&dictionary[el.textContent.trim()]!==el.textContent.trim()).map(el=>el.textContent.trim()):[];
 return {language:language.value,untranslated:[...new Set(untranslated)],path:win.location.pathname,width:vw,scrollWidth:doc.documentElement.scrollWidth,pass:doc.documentElement.scrollWidth<=vw+1,menu:!!Array.from(doc.querySelectorAll('button')).find(b=>b.getAttribute('aria-label')==='Открыть меню'&&win.getComputedStyle(b).display!=='none'),offenders};
}
async function load(path,w){screen.style.width=w+'px';screen.width=w;await new Promise(resolve=>{screen.onload=resolve;screen.src=path});await delay(250);const picker=screen.contentDocument.querySelector('[role="group"][aria-label="Язык / Тил"] button[lang="'+language.value+'"]');if(picker&&picker.getAttribute('aria-pressed')!=='true'){picker.click();await delay(150)}}
async function show(){await load(route.value,Number(width.value));report.textContent=JSON.stringify(inspect(),null,2)}
width.onchange=show;route.onchange=show;language.onchange=show;document.getElementById('check').onclick=()=>{report.textContent=JSON.stringify(inspect(),null,2)};
document.getElementById('audit').onclick=async()=>{
 document.getElementById('audit').disabled=true;window.auditResults=[];
 for(const lang of ['ru','ky'])for(const w of [320,390,768,1440])for(const path of routes){language.value=lang;
  status.textContent=lang+' · '+w+'px · '+path;await load(path,w);window.auditResults.push(inspect());report.textContent=JSON.stringify({checked:window.auditResults.length,failures:window.auditResults.filter(r=>!r.pass),untranslated:window.auditResults.filter(r=>r.untranslated.length).map(r=>({path:r.path,width:r.width,labels:r.untranslated}))},null,2);
 }
 status.textContent='Готово: '+window.auditResults.length+' проверок';document.getElementById('audit').disabled=false;await show();report.textContent=JSON.stringify({checked:window.auditResults.length,failures:window.auditResults.filter(r=>!r.pass),untranslated:window.auditResults.filter(r=>r.untranslated.length).map(r=>({path:r.path,width:r.width,labels:r.untranslated}))},null,2);
};
show();
</script>
</html>
